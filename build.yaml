global_options:
  freezed:
    runs_before:
      - json_serializable
  json_serializable:
    runs_before:
      - retrofit_generator

targets:
  $default:
    builders:
      freezed:freezed:
        generate_for:
          include:
            - lib/data/models/**.dart
            - lib/data/models/**/**.dart
            - lib/data/source/**/**.dart
            - lib/controllers/**/**.dart
            - lib/presentation/blocs/**/**.dart
      json_serializable:
        generate_for:
          include:
            - lib/data/models/**.dart
            - lib/data/models/**/**.dart
            - lib/data/source/**/**.dart
            - lib/controllers/**/**.dart
            - lib/presentation/blocs/**/**.dart
        options:
          explicit_to_json: true
          include_if_null: false